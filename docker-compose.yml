version: "3.8"

services:
  fraud-detection-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_web_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_PATH=models/best_model.joblib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
